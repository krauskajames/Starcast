name: Keep Supabase awake

# Supabase pauses free projects after 7 days without database activity. This makes one small
# read every 3 days so sign-in and saved locations keep working. It uses the same public
# (publishable) key the app already ships in src/js/75-account.js; row-level security means
# it reads nothing, but the query still reaches the database, which counts as activity.

on:
  schedule:
    - cron: '17 15 */3 * *'   # every 3 days, about 10:17 am CDT
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database
        env:
          SUPABASE_URL: https://lqlkyanlnmszxyuyqjyd.supabase.co
          SUPABASE_KEY: sb_publishable_QYdjcr5V44YgWq676MwGFQ_aYkfGlGB
        run: |
          code=$(curl -s -o body.txt -w '%{http_code}' \
            "$SUPABASE_URL/rest/v1/saved_locations?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY")
          echo "HTTP $code"; cat body.txt; echo
          if [ "$code" -ge 400 ]; then
            echo "::error::Supabase answered $code. If the project is paused, restore it in the Supabase dashboard."
            exit 1
          fi
