<title>Starcast</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: full-bleed globe, instrument-panel overlays (layers left, time bar bottom, detail panel right / bottom sheet on phones). Deliberately dark-only: a night-use tool. */
:root{
  /* dark (default) */
  --bg:#05080f; --panel:rgba(10,16,28,.93); --panel-solid:#0b1220; --raise:#121c2e;
  --line:#1c2840; --line-2:#2a3a58; --fg:#dbe2ee; --fg-2:#b8c2d4; --muted:#8593ab; --faint:#56637b;
  --accent:#f1b450; --accent-ink:#1a1204; --good:#56c9ad; --warn:#e7a23c; --bad:#df6157;
  --fade:rgba(5,8,15,.96); --fade-0:rgba(5,8,15,0); --nodata:#11182a;
  --alert-line:#3a3020; --alert-bg:rgba(241,180,80,.07); --danger-line:#5a2222; --danger-bg:rgba(223,97,87,.08); --danger-fg:#ff9d92;
  --ex-bg:#1f5a50; --ex-fg:#c9fff0; --gd-bg:#24456e; --gd-fg:#d6e8ff; --fr-bg:#4a3a1c; --fr-fg:#ffe2a8; --pr-bg:#2a2e3a; --pr-fg:#8593ab;
  --t-planet-bg:#3b3120; --t-planet-fg:#f4d49a; --t-meteor-bg:#1c3442; --t-meteor-fg:#9fd9f2; --t-moon-bg:#272c3a; --t-moon-fg:#c7cfe0;
  --t-eclipse-bg:#3e2228; --t-eclipse-fg:#f2a7a7; --t-mars-bg:#3e2219; --t-mars-fg:#f5b39c; --t-green-bg:#173a2c; --t-green-fg:#9ff0c8;
  --fc-bg:#13283a; --fc-fg:#bfe3ff; --fc-line:#1f3d58;
  --map-sea:#08101d; --map-land:#142033; --map-grat:rgba(120,150,200,.10); --map-border:rgba(150,170,205,.35); --map-state:rgba(150,170,205,.28);
  --map-coast:rgba(160,180,215,.28); --map-wi:rgba(241,180,80,.85); --map-rim:rgba(120,150,210,.35); --map-label:rgba(230,236,246,.82);
  --map-sky:#9fd9f2; --map-saved:#f1b450; --map-saved-label:#f6d9a3; --map-sel:#ffffff; --map-drive:#56c9ad; --map-night:0.62;
  --f-display:"Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:8px; color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#e9edf3; --panel:rgba(255,255,255,.94); --panel-solid:#ffffff; --raise:#f3f5f9;
  --line:#dde3ec; --line-2:#c3cddb; --fg:#162033; --fg-2:#34405a; --muted:#56637b; --faint:#7d889d;
  --accent:#a8650f; --accent-ink:#ffffff; --good:#1b8a6f; --warn:#a96f12; --bad:#c03d33;
  --fade:rgba(233,237,243,.96); --fade-0:rgba(233,237,243,0); --nodata:#e3e8ef;
  --alert-line:#ead2aa; --alert-bg:rgba(168,101,15,.07); --danger-line:#efb5ae; --danger-bg:#fcebe9; --danger-fg:#a3332a;
  --ex-bg:#d2f1e7; --ex-fg:#0d5a48; --gd-bg:#d9e7fb; --gd-fg:#1c4a8c; --fr-bg:#f7e8cc; --fr-fg:#76500e; --pr-bg:#eceff4; --pr-fg:#5a6478;
  --t-planet-bg:#f6e6c4; --t-planet-fg:#6f4a0c; --t-meteor-bg:#d8eef8; --t-meteor-fg:#14506b; --t-moon-bg:#e6e9f0; --t-moon-fg:#3c465c;
  --t-eclipse-bg:#f8dcdc; --t-eclipse-fg:#8a2a2a; --t-mars-bg:#f9ddd2; --t-mars-fg:#8a3416; --t-green-bg:#d6f2e4; --t-green-fg:#0f5b3b;
  --fc-bg:#e2eefa; --fc-fg:#1c4a8c; --fc-line:#bcd5ee;
  --map-sea:#c9d7e6; --map-land:#f5f3ee; --map-grat:rgba(40,70,110,.12); --map-border:rgba(40,60,95,.40); --map-state:rgba(40,60,95,.28);
  --map-coast:rgba(40,60,95,.30); --map-wi:rgba(168,101,15,.95); --map-rim:rgba(40,70,120,.35); --map-label:rgba(22,32,51,.85);
  --map-sky:#14608a; --map-saved:#a8650f; --map-saved-label:#6f4206; --map-sel:#162033; --map-drive:#127a5f; --map-night:0.45;
  color-scheme:light;
}}
:root[data-theme="light"]{
  --bg:#e9edf3; --panel:rgba(255,255,255,.94); --panel-solid:#ffffff; --raise:#f3f5f9;
  --line:#dde3ec; --line-2:#c3cddb; --fg:#162033; --fg-2:#34405a; --muted:#56637b; --faint:#7d889d;
  --accent:#a8650f; --accent-ink:#ffffff; --good:#1b8a6f; --warn:#a96f12; --bad:#c03d33;
  --fade:rgba(233,237,243,.96); --fade-0:rgba(233,237,243,0); --nodata:#e3e8ef;
  --alert-line:#ead2aa; --alert-bg:rgba(168,101,15,.07); --danger-line:#efb5ae; --danger-bg:#fcebe9; --danger-fg:#a3332a;
  --ex-bg:#d2f1e7; --ex-fg:#0d5a48; --gd-bg:#d9e7fb; --gd-fg:#1c4a8c; --fr-bg:#f7e8cc; --fr-fg:#76500e; --pr-bg:#eceff4; --pr-fg:#5a6478;
  --t-planet-bg:#f6e6c4; --t-planet-fg:#6f4a0c; --t-meteor-bg:#d8eef8; --t-meteor-fg:#14506b; --t-moon-bg:#e6e9f0; --t-moon-fg:#3c465c;
  --t-eclipse-bg:#f8dcdc; --t-eclipse-fg:#8a2a2a; --t-mars-bg:#f9ddd2; --t-mars-fg:#8a3416; --t-green-bg:#d6f2e4; --t-green-fg:#0f5b3b;
  --fc-bg:#e2eefa; --fc-fg:#1c4a8c; --fc-line:#bcd5ee;
  --map-sea:#c9d7e6; --map-land:#f5f3ee; --map-grat:rgba(40,70,110,.12); --map-border:rgba(40,60,95,.40); --map-state:rgba(40,60,95,.28);
  --map-coast:rgba(40,60,95,.30); --map-wi:rgba(168,101,15,.95); --map-rim:rgba(40,70,120,.35); --map-label:rgba(22,32,51,.85);
  --map-sky:#14608a; --map-saved:#a8650f; --map-saved-label:#6f4206; --map-sel:#162033; --map-drive:#127a5f; --map-night:0.45;
  color-scheme:light;
}
:root[data-theme="dark"]{ color-scheme:dark; }
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;overflow:hidden}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
#app{position:fixed;inset:0;display:grid;grid-template-columns:1fr 400px;grid-template-rows:1fr}
#stage{position:relative;min-width:0;overflow:hidden}
#globe{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
#globe:active{cursor:grabbing}

/* top bar */
.top{position:absolute;top:0;left:0;right:0;display:flex;align-items:flex-start;gap:12px;
  padding:calc(12px + env(safe-area-inset-top,0px)) 16px 0 max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.brand{pointer-events:auto;display:flex;flex-direction:column;gap:2px}
.brand h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.06em;text-transform:uppercase;line-height:1}
.brand h1 span{color:var(--accent)}
.status{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.status .dot{width:7px;height:7px;border-radius:50%;background:var(--good);display:inline-block}
.status.demo .dot{background:var(--warn)} .status.loading .dot{background:var(--faint)}
.status button{pointer-events:auto;background:none;border:0;color:var(--accent);padding:0;font-size:12px;text-decoration:underline;text-underline-offset:2px}
.top .spacer{flex:1}
.top .iconbtn + .iconbtn{margin-left:-4px}
.iconbtn{white-space:nowrap;pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:7px 10px;font-family:var(--f-display);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.iconbtn[aria-pressed="true"]{color:#ff8a7a;border-color:#5a2222}

/* layers */
.layers{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:84px;width:208px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:10px;backdrop-filter:blur(6px)}
.lgroup h3{margin:0 0 6px;font-family:var(--f-display);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:600}
.chips{display:flex;flex-direction:column;gap:2px}
.chip{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:6px;padding:5px 7px;color:var(--fg);font-size:13px}
.chip:hover{background:var(--raise)}
.chip[aria-pressed="true"]{background:var(--raise);border-color:var(--line-2)}
.chip .sw{width:10px;height:10px;border-radius:2px;flex:none;border:1px solid rgba(255,255,255,.15)}
.chip.radio .sw{border-radius:50%}
.chip[aria-pressed="false"] .sw{opacity:.35}
.chip .k{margin-left:auto;font-size:11px;color:var(--faint)}
.layer-note{font-size:12px;color:var(--muted);line-height:1.4;margin:0}
.legend{display:flex;flex-direction:column;gap:4px}
.legend .bar{height:8px;border-radius:2px}
.legend .ticks{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted)}

/* time bar */
.timebar{position:absolute;left:0;right:0;bottom:0;padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(to top,var(--fade) 55%,var(--fade-0));display:flex;gap:12px;align-items:center}
.play{flex:none;width:38px;height:38px;border-radius:50%;border:1px solid var(--line-2);background:var(--panel-solid);display:grid;place-items:center;color:var(--accent)}
.tcol{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.tlabel{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.tlabel b{font-family:var(--f-display);font-size:15px;color:var(--fg);letter-spacing:.03em;font-weight:600}
.track{position:relative;height:30px}
.track canvas{position:absolute;left:0;right:0;top:9px;height:12px;width:100%;border-radius:3px}
#tslider{position:absolute;inset:0;width:100%;margin:0;background:transparent;-webkit-appearance:none;appearance:none}
#tslider::-webkit-slider-runnable-track{height:30px;background:transparent}
#tslider::-moz-range-track{height:30px;background:transparent}
#tslider::-webkit-slider-thumb{-webkit-appearance:none;width:4px;height:30px;background:var(--accent);border-radius:2px;box-shadow:0 0 0 3px rgba(241,180,80,.25)}
#tslider::-moz-range-thumb{width:4px;height:30px;background:var(--accent);border:0;border-radius:2px}
.dayticks{position:relative;height:13px;font-size:10.5px;color:var(--faint)}
.dayticks span{position:absolute;transform:translateX(-50%);white-space:nowrap}

/* panel */
.panel{position:relative;background:var(--panel-solid);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
.tabs{display:flex;border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 0 12px;gap:2px}
.tab{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:10px 4px 9px;font-family:var(--f-display);font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.pbody{flex:1;overflow-y:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) 16px;display:flex;flex-direction:column;gap:18px;min-height:0}
.handle{display:none}
h2{margin:0;font-family:var(--f-display);font-size:20px;font-weight:600;letter-spacing:.02em;text-wrap:balance}
h4{margin:0 0 8px;font-family:var(--f-display);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:600}
.sub{color:var(--muted);font-size:12.5px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{background:var(--raise);border:1px solid var(--line-2);border-radius:6px;padding:6px 11px;font-size:13px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.ghost{background:none}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
input[type=text],input[type=number],select{background:var(--bg);border:1px solid var(--line-2);border-radius:6px;padding:6px 8px;min-width:0}
input[type=number]{width:84px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.locline{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.locline > div{min-width:0}

/* now cards */
.now{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stat{background:var(--raise);border:1px solid var(--line);border-radius:6px;padding:8px 8px 7px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .l{font-size:10.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.1em;font-family:var(--f-display)}
.stat .v{font-family:var(--f-mono);font-size:16px;font-weight:600}
.stat .n{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* alert preview */
.alert{border:1px solid var(--alert-line);background:var(--alert-bg);border-radius:var(--r);padding:12px 13px;display:flex;flex-direction:column;gap:5px}
.alert .h{font-family:var(--f-display);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.alert p{margin:0;line-height:1.45}
.alert.danger{border-color:var(--danger-line);background:var(--danger-bg)} .alert.danger .h{color:var(--danger-fg)}
.alert.green{border-color:var(--t-green-bg);background:var(--t-green-bg)} .alert.green .h{color:var(--t-green-fg)}

/* forecast strip */
.strip-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.strip{display:grid;grid-auto-flow:row;font-size:10.5px;width:max-content}
.srow{display:flex;align-items:center}
.srow .lab{position:sticky;left:0;z-index:2;width:86px;flex:none;background:var(--bg);padding:0 6px;color:var(--muted);height:15px;line-height:15px;white-space:nowrap;border-right:1px solid var(--line)}
.cell{width:13px;height:13px;margin:1px 1px 1px 0;flex:none;border-radius:1.5px;cursor:pointer}
.cell.sel{outline:2px solid var(--accent);outline-offset:0}
.srow.hdr .cell{background:none;color:var(--faint);text-align:center;height:14px;cursor:default;font-family:var(--f-mono);font-size:9px;overflow:visible}
.srow.days .cell{background:none;height:15px;color:var(--fg);font-family:var(--f-display);font-size:10.5px;overflow:visible;white-space:nowrap;cursor:default}

/* targets */
.nights{display:flex;gap:4px;flex-wrap:wrap}
.nights button{background:none;border:1px solid var(--line-2);border-radius:20px;padding:4px 11px;font-size:12.5px;color:var(--muted)}
.nights button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:700}
.tlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.tg{display:grid;grid-template-columns:42px 1fr;gap:10px;padding:9px;border:1px solid var(--line);border-radius:6px;background:var(--raise)}
.tg .sc{width:42px;height:42px;border-radius:6px;display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:16px;line-height:1}
.sc small{display:block;font-size:8px;font-family:var(--f-display);letter-spacing:.08em;text-transform:uppercase;margin-top:2px;font-weight:600}
.s-ex{background:var(--ex-bg);color:var(--ex-fg)}.s-gd{background:var(--gd-bg);color:var(--gd-fg)}.s-fr{background:var(--fr-bg);color:var(--fr-fg)}.s-pr{background:var(--pr-bg);color:var(--pr-fg)}
.tg .nm{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.tg .nm b{font-size:14.5px}
.tg .kd{font-size:11.5px;color:var(--muted)}
.tg .win{font-size:12px;color:var(--fg);margin-top:2px}
.tg .det{margin:5px 0 0;font-size:12.5px;line-height:1.45;color:var(--fg-2)}
.spark{display:flex;gap:1px;align-items:flex-end;height:16px;margin-top:5px}
.spark i{flex:1;min-width:2px;background:var(--line-2);border-radius:1px}
.more{background:none;border:0;color:var(--accent);padding:4px 0;font-size:13px;text-align:left}
.dim{opacity:.6}
.why{font-size:12px;color:var(--muted)}

/* calendar */
.filters{display:flex;gap:4px;flex-wrap:wrap}
.filters button{background:none;border:1px solid var(--line-2);border-radius:20px;padding:3px 10px;font-size:12px;color:var(--muted)}
.filters button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.month{display:flex;flex-direction:column;gap:6px}
.ev{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:start;padding:8px 0;border-top:1px solid var(--line)}
.ev .d{font-family:var(--f-mono);text-align:center;line-height:1.1;padding-top:2px}
.ev .d b{display:block;font-size:18px}
.ev .d span{font-size:10px;color:var(--faint);text-transform:uppercase}
.ev .t{font-weight:700;font-size:13.5px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ev .nt{font-size:12.5px;color:var(--muted);line-height:1.45;margin-top:2px}
.tag{font-family:var(--f-display);font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:1px 6px;border-radius:3px;background:var(--line);color:var(--muted);font-weight:600}
.tag.planet,.tag.saved{background:var(--t-planet-bg);color:var(--t-planet-fg)}.tag.meteor{background:var(--t-meteor-bg);color:var(--t-meteor-fg)}.tag.moon{background:var(--t-moon-bg);color:var(--t-moon-fg)}.tag.eclipse{background:var(--t-eclipse-bg);color:var(--t-eclipse-fg)}.tag.mars{background:var(--t-mars-bg);color:var(--t-mars-fg)}.tag.occultation{background:var(--t-eclipse-bg);color:var(--t-eclipse-fg)}.tag.green{background:var(--t-green-bg);color:var(--t-green-fg)}
.fc{display:inline-block;margin-top:5px;font-size:12px;padding:3px 8px;border-radius:4px;background:var(--fc-bg);color:var(--fc-fg);border:1px solid var(--fc-line)}

/* gear */
.gstats{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.gstats .stat .v{font-size:14px}
.form{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.form > *{min-width:0}
label.f input[type=text],label.f select{width:100%;min-width:0}
.form .wide{grid-column:1/-1}
.eps{display:flex;flex-direction:column;gap:6px}
.ep{display:flex;gap:6px;align-items:end;flex-wrap:wrap}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.checks label{display:flex;gap:7px;align-items:center;font-size:13px}
table.views{width:100%;border-collapse:collapse;font-size:12.5px}
table.views th,table.views td{text-align:left;padding:5px 4px;border-bottom:1px solid var(--line)}
table.views th{color:var(--faint);font-weight:400;font-size:11px;text-transform:uppercase;letter-spacing:.08em}
table.views td.mono{text-align:right}
table.views th.r{text-align:right}

/* saved */
.slist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.sv{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--raise)}
.sv .info{flex:1;min-width:0}
.sv .info b{display:block}
.empty{color:var(--muted);font-size:13px;line-height:1.5;padding:10px;border:1px dashed var(--line-2);border-radius:6px}
.note{font-size:12px;color:var(--faint);line-height:1.5}
.note a{color:var(--muted)}
#red{position:fixed;inset:0;background:#ff0000;mix-blend-mode:multiply;pointer-events:none;z-index:50}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:6px;font-size:13px;z-index:40;font-weight:700}
.tip{position:absolute;pointer-events:none;background:var(--panel-solid);border:1px solid var(--line-2);border-radius:6px;padding:5px 8px;font-size:12px;z-index:5;white-space:nowrap}

/* observing plan */
.plan{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.plan li{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:start;padding:8px 9px;border:1px solid var(--line);border-radius:6px;background:var(--raise)}
.plan .ptime{font-weight:600;padding-top:1px}
.plan .sub{white-space:normal}
.mbar{display:block;height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:4px}
.mbar i{display:block;height:100%;background:var(--good)}

/* modals */
.modal{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column}
.sky-modal{background:var(--panel-solid);padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));gap:8px}
.sky-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.sky-wrap{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center}
.sky-wrap canvas{touch-action:manipulation}
.sky-foot{margin:0;text-align:center}
.red-modal{background:#000;color:#ff4a3a;font-family:var(--f-body);color-scheme:dark}
.rv{max-width:640px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:10px;padding:calc(16px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));height:100%;overflow-y:auto}
.rv-top{display:flex;justify-content:space-between;align-items:center;font-size:15px;color:#b3261e}
.rv-time{font-size:22px;color:#ff6a5c}
.rv-name{font-family:var(--f-display);font-size:clamp(30px,8vw,46px);line-height:1.05;color:#ff4a3a;margin:0}
.rv-where{font-size:clamp(22px,5.5vw,30px);line-height:1.25;color:#ff5a4a}
.rv-line{font-size:20px;color:#e0392b}
.rv-detail{font-size:18px;line-height:1.5;color:#c8301f;margin:6px 0}
.rv-nav{display:flex;gap:10px;margin-top:auto;flex-wrap:wrap}
.rbtn{flex:1;min-width:110px;background:#1a0000;border:1px solid #6e0f08;color:#ff4a3a;border-radius:10px;padding:14px 12px;font-size:18px;font-family:var(--f-display);letter-spacing:.04em}
.rbtn.strong{background:#5a0a04;border-color:#a3170c}
.rbtn:disabled{opacity:.35}
.rv-top .rbtn{flex:none;min-width:0;padding:8px 14px;font-size:15px}

@media (max-width: 860px){
  #app{grid-template-columns:1fr;grid-template-rows:1fr}
  .panel{position:fixed;left:0;right:0;bottom:0;height:52%;border-left:0;border-top:1px solid var(--line);border-radius:14px 14px 0 0;z-index:10;transition:height .25s}
  .panel.big{height:88%}
  .panel.small{height:118px}
  .handle{display:block;width:100%;background:none;border:0;padding:8px 0 0}
  .handle i{display:block;margin:0 auto;width:40px;height:4px;border-radius:2px;background:var(--line-2)}
  .tabs{padding-top:0}
  #stage{position:fixed;left:0;right:0;top:0;bottom:var(--sheet,52%)}
  .layers{top:auto;bottom:74px;left:0;right:0;width:auto;border-radius:0;border-left:0;border-right:0;flex-direction:row;overflow-x:auto;padding:8px max(16px,env(safe-area-inset-left,0px));gap:14px}
  .layers .lgroup{flex:none}
  .layers .chips{flex-direction:row;gap:4px}
  .chip{width:auto;white-space:nowrap}
  .chip .k,.layer-note{display:none}
  .layers .legend{min-width:150px}
  .timebar{padding-bottom:10px}
  .brand h1{font-size:18px}
}
@media (prefers-reduced-motion: reduce){ .panel{transition:none} }
</style>

<div id="app">
  <div id="stage">
    <canvas id="globe" aria-label="Globe showing viewing conditions. Drag to rotate, scroll or pinch to zoom, click a spot for its forecast."></canvas>
    <div class="top">
      <div class="brand">
        <h1>Star<span>cast</span></h1>
        <div class="status loading" id="status"><span class="dot"></span><span id="statusText">Loading forecast…</span></div>
      </div>
      <div class="spacer"></div>
      <button class="iconbtn" id="themeBtn" title="Switch between automatic, light and dark">Theme: Auto</button>
      <button class="iconbtn" id="redBtn" aria-pressed="false" title="Red night-vision mode">Night red</button>
    </div>
    <div class="layers" id="layers"></div>
    <div class="timebar">
      <button class="play" id="playBtn" aria-label="Play forecast animation"><svg width="14" height="14" viewBox="0 0 14 14"><path id="playIcon" d="M3 1.5v11l9-5.5z" fill="currentColor"/></svg></button>
      <div class="tcol">
        <div class="tlabel"><b id="tTime">—</b><span id="tSun">—</span></div>
        <div class="track"><canvas id="tband"></canvas><input type="range" id="tslider" min="0" max="71" value="0" aria-label="Forecast hour"></div>
        <div class="dayticks" id="dayticks"></div>
      </div>
    </div>
    <div class="tip" id="tip" hidden></div>
  </div>
  <aside class="panel" id="panel">
    <button class="handle" id="handle" aria-label="Resize panel"><i></i></button>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="loc" aria-selected="true">Forecast</button>
      <button class="tab" role="tab" data-tab="saved" aria-selected="false">Saved</button>
      <button class="tab" role="tab" data-tab="cal" aria-selected="false">Calendar</button>
      <button class="tab" role="tab" data-tab="gear" aria-selected="false">Gear</button>
    </div>
    <div class="pbody" id="pbody"></div>
  </aside>
</div>
<div id="red" hidden></div>
